# nginx + PHP-FPM. Replace the paths and the domain.
server {
    listen 80;
    server_name agora.example.org;
    root /var/www/agora/public;          # only public/ is served
    index index.php;
    client_max_body_size 6m;             # a bit more than max_upload_mb

    location = /style.css {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.php$is_args$args;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;   # check the name of your PHP-FPM socket
    }
    gzip on;
    gzip_types text/css text/calendar text/csv application/json;
}
